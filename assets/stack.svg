<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="05 — technical stack">
<title>05 — technical stack</title>
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  .fg { fill: #e6edf3; } .mu { fill: #8b949e; } .ac { fill: #3b82f6; }
  .cap { letter-spacing: 3px; font-size: 10.5px; }
  .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.6s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .flow { stroke-dasharray: 4 7; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -22; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
  .fade { opacity: 0; animation: fade .9s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .draw, .flow, .blink, .pulse, .fade { animation: none !important; stroke-dashoffset: 0; opacity: 1; }
  }
</style>
<rect width="880" height="270" rx="14" fill="#0d1117"/>
<text x="40" y="50" font-size="34" class="fg" text-anchor="start" font-weight="500" >05</text>
<text x="98" y="44" font-size="12" class="fg" text-anchor="start" font-weight="400" letter-spacing="5">STACK</text>
<line x1="181" y1="40" x2="752" y2="40" stroke="#30363d" class="draw"/>
<text x="840" y="44" font-size="11" class="mu" text-anchor="end" font-weight="400" >~/05-stack</text>
<line x1="140" y1="84" x2="140" y2="248" stroke="#30363d"/>
<text x="40" y="102" font-size="13" class="mu cap" text-anchor="start" font-weight="400" >BACKEND</text>
<text x="158" y="102" font-size="13" class="fg" text-anchor="start" font-weight="400" >Laravel · PHP · REST APIs · Sanctum · Queues · Events · Jobs</text>
<text x="40" y="128" font-size="13" class="mu cap" text-anchor="start" font-weight="400" >FRONTEND</text>
<text x="158" y="128" font-size="13" class="fg" text-anchor="start" font-weight="400" >React · Next.js · TypeScript · Tailwind CSS</text>
<text x="40" y="154" font-size="13" class="mu cap" text-anchor="start" font-weight="400" >DATA</text>
<text x="158" y="154" font-size="13" class="fg" text-anchor="start" font-weight="400" >MySQL · PostgreSQL · Redis</text>
<text x="40" y="180" font-size="13" class="mu cap" text-anchor="start" font-weight="400" >INFRA</text>
<text x="158" y="180" font-size="13" class="fg" text-anchor="start" font-weight="400" >Docker · Linux · Git · GitHub · CI/CD</text>
<text x="40" y="206" font-size="13" class="mu cap" text-anchor="start" font-weight="400" >OBSERVE</text>
<text x="158" y="206" font-size="13" class="fg" text-anchor="start" font-weight="400" >OpenTelemetry · SigNoz · Tracing · Metrics</text>
<text x="40" y="232" font-size="13" class="mu cap" text-anchor="start" font-weight="400" >PRACTICE</text>
<text x="158" y="232" font-size="13" class="fg" text-anchor="start" font-weight="400" >Clean Architecture · Code Review · Security · Arabic / RTL</text>
</svg>
