<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-label="03 — selected projects">
<title>03 — selected projects</title>
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  .fg { fill: #e6edf3; } .mu { fill: #8b949e; } .ac { fill: #3b82f6; }
  .cap { letter-spacing: 3px; font-size: 10.5px; }
  .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.6s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .flow { stroke-dasharray: 4 7; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -22; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
  .fade { opacity: 0; animation: fade .9s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .draw, .flow, .blink, .pulse, .fade { animation: none !important; stroke-dashoffset: 0; opacity: 1; }
  }
</style>
<rect width="880" height="460" rx="14" fill="#0d1117"/>
<text x="40" y="50" font-size="34" class="fg" text-anchor="start" font-weight="500" >03</text>
<text x="98" y="44" font-size="12" class="fg" text-anchor="start" font-weight="400" letter-spacing="5">PROJECTS</text>
<line x1="220" y1="40" x2="731" y2="40" stroke="#30363d" class="draw"/>
<text x="840" y="44" font-size="11" class="mu" text-anchor="end" font-weight="400" >~/03-projects</text>
<text x="40" y="100" font-size="13" class="fg" text-anchor="start" font-weight="700" letter-spacing="1">01 / AUTOCONNECT</text>
<text x="40" y="120" font-size="11.5" class="fg" text-anchor="start" font-weight="400" >Automotive CX platform — Laravel APIs for vehicle reservations, service bookings and payments.</text>
<text x="40" y="138" font-size="9.5" class="mu" text-anchor="start" font-weight="400" letter-spacing="1.5">PARALLEL · LARAVEL · PAYMENTS · SAP INTEGRATION</text>
<line x1="40" y1="152" x2="840" y2="152" stroke="#30363d" stroke-width="1"/>
<text x="40" y="170" font-size="13" class="fg" text-anchor="start" font-weight="700" letter-spacing="1">02 / PROPERTY CENTRAL</text>
<text x="40" y="190" font-size="11.5" class="fg" text-anchor="start" font-weight="400" >Real estate CX platform — project &amp; unit discovery, inquiries and reservations.</text>
<text x="40" y="208" font-size="9.5" class="mu" text-anchor="start" font-weight="400" letter-spacing="1.5">PARALLEL · LARAVEL · REAL ESTATE</text>
<line x1="40" y1="222" x2="840" y2="222" stroke="#30363d" stroke-width="1"/>
<text x="40" y="240" font-size="13" class="fg" text-anchor="start" font-weight="700" letter-spacing="1">03 / FINANCING SOLUTION</text>
<text x="40" y="260" font-size="11.5" class="fg" text-anchor="start" font-weight="400" >Financing workflows connected to the vehicle purchase journey.</text>
<text x="40" y="278" font-size="9.5" class="mu" text-anchor="start" font-weight="400" letter-spacing="1.5">PARALLEL · WORKFLOWS · DATA CONSISTENCY</text>
<line x1="40" y1="292" x2="840" y2="292" stroke="#30363d" stroke-width="1"/>
<text x="40" y="310" font-size="13" class="fg" text-anchor="start" font-weight="700" letter-spacing="1">04 / MEDICAOS</text>
<text x="40" y="330" font-size="11.5" class="fg" text-anchor="start" font-weight="400" >Multi-tenant clinic SaaS — tenant isolation, roles, queues, EMR, prescriptions, billing.</text>
<text x="40" y="348" font-size="9.5" class="mu" text-anchor="start" font-weight="400" letter-spacing="1.5">SELF-EMPLOYED · MULTI-TENANCY · LARAVEL · REACT</text>
<line x1="40" y1="362" x2="840" y2="362" stroke="#30363d" stroke-width="1"/>
<text x="40" y="380" font-size="13" class="fg" text-anchor="start" font-weight="700" letter-spacing="1">05 / ERP · CRM · E-COMMERCE</text>
<text x="40" y="400" font-size="11.5" class="fg" text-anchor="start" font-weight="400" >Business systems — ERP modules, customer management and online stores with checkout.</text>
<text x="40" y="418" font-size="9.5" class="mu" text-anchor="start" font-weight="400" letter-spacing="1.5">ERAASOFT · FREELANCE · LARAVEL · REACT</text>
<line x1="40" y1="432" x2="840" y2="432" stroke="#30363d" stroke-width="1"/>
</svg>
