<svg xmlns="http://www.w3.org/2000/svg" width="880" height="74" viewBox="0 0 880 74" role="img" aria-label="06 — activity">
<title>06 — activity</title>
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  .fg { fill: #e6edf3; } .mu { fill: #8b949e; } .ac { fill: #3b82f6; }
  .cap { letter-spacing: 3px; font-size: 10.5px; }
  .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.6s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .flow { stroke-dasharray: 4 7; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -22; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
  .fade { opacity: 0; animation: fade .9s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .draw, .flow, .blink, .pulse, .fade { animation: none !important; stroke-dashoffset: 0; opacity: 1; }
  }
</style>
<rect width="880" height="74" rx="14" fill="#0d1117"/>
<text x="40" y="50" font-size="34" class="fg" text-anchor="start" font-weight="500" >06</text>
<text x="98" y="44" font-size="12" class="fg" text-anchor="start" font-weight="400" letter-spacing="5">ACTIVITY</text>
<line x1="220" y1="40" x2="731" y2="40" stroke="#30363d" class="draw"/>
<text x="840" y="44" font-size="11" class="mu" text-anchor="end" font-weight="400" >~/06-activity</text>
</svg>
