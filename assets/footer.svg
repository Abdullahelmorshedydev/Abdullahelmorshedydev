<svg xmlns="http://www.w3.org/2000/svg" width="880" height="96" viewBox="0 0 880 96" role="img" aria-label="Current status: shipping">
<title>Current status: shipping</title>
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  .fg { fill: #e6edf3; } .mu { fill: #8b949e; } .ac { fill: #3b82f6; }
  .cap { letter-spacing: 3px; font-size: 10.5px; }
  .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.6s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .flow { stroke-dasharray: 4 7; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -22; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
  .fade { opacity: 0; animation: fade .9s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .draw, .flow, .blink, .pulse, .fade { animation: none !important; stroke-dashoffset: 0; opacity: 1; }
  }
</style>
<rect width="880" height="96" rx="14" fill="#0d1117"/>
<line x1="40" y1="20" x2="840" y2="20" stroke="#30363d" stroke-width="1"/>
<circle cx="46" cy="56" r="4" fill="#3b82f6"/>
<circle cx="46" cy="56" r="4" fill="#3b82f6" class="pulse"/>
<text x="62" y="54" font-size="13" class="fg cap" text-anchor="start" font-weight="400" >STATUS — SHIPPING</text>
<text x="62" y="72" font-size="10.5" class="mu" text-anchor="start" font-weight="400" >probably tracing a slow query</text>
<text x="840" y="60" font-size="11" class="fg" text-anchor="end" font-weight="400" >github.com/Abdullahelmorshedydev  ·  © 2026</text>
</svg>
